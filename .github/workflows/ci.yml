name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash  # identical globbing and quoting on Linux, macOS and Windows

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run agentic-chaos-security validate experiments
      - run: uv run pytest -W error::DeprecationWarning
      - name: Hardened demo targets pass the catalogs
        run: |
          uv run agentic-chaos-security run experiments/*.yaml --target examples.mailbot.agent:hardened
          uv run agentic-chaos-security run experiments/mcp --target examples.mcp_demo.host:hardened
          uv run agentic-chaos-security run experiments/multi-agent experiments/ap2 --target examples.shopper.agent:hardened

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --group interop
      - run: uv run mypy  # strict; needs the optional framework packages for the adapters
      - run: uv run pytest -m interop -v

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hardened agent passes (action self-test)
        uses: ./
        with:
          experiments: experiments/*.yaml
          target: examples.mailbot.agent:hardened
          report-name: self-test-hardened
      - name: Naive agent fails (fail-on never, check the exit code)
        id: naive
        uses: ./
        with:
          experiments: experiments/asi08-tool-outage.yaml
          fail-on: never
          report-name: self-test-naive
      - shell: bash
        env:
          CODE: ${{ steps.naive.outputs.exit-code }}
        run: test "$CODE" = "1"
