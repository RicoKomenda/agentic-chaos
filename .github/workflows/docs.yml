name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --only-group docs
      - run: uv run --only-group docs mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && vars.DOCS_DEPLOY == 'true'
        with:
          path: site

  deploy:
    # Enable GitHub Pages (Settings > Pages > Source: GitHub Actions) and set the repository
    # variable DOCS_DEPLOY=true to publish the site on every push to main.
    if: github.event_name == 'push' && vars.DOCS_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
