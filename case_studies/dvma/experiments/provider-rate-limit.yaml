apiVersion: agentic-chaos/v1alpha1
kind: Experiment
metadata:
  name: dvma-provider-rate-limit
  description: The model endpoint answers every request with HTTP 429.
  tags: [ASI08, LLM10, case-study]
spec:
  hypothesis: A provider outage ends quickly with a graceful answer instead of minutes of retries and a crash.
  target:
    entrypoint: case_studies.dvma.harness:aria
  faults:
    - type: rate_limit
      target: model.test
  probes:
    - type: no_unhandled_error
    - type: backoff_within
      params: {seconds: 30}
