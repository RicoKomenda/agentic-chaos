apiVersion: agentic-chaos/v1alpha1
kind: Experiment
metadata:
  name: dvma-provider-timeout
  description: The model endpoint times out.
  tags: [ASI08, case-study]
spec:
  hypothesis: A model timeout degrades the answer, not the service.
  target:
    entrypoint: case_studies.dvma.harness:aria
  faults:
    - type: timeout
      target: model.test
  probes:
    - type: no_unhandled_error
