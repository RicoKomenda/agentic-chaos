apiVersion: agentic-chaos/v1alpha1
kind: Experiment
metadata:
  name: ap2-duplicate-charge
  description: The processor settles the payment, but the agent sees a timeout and retries.
  tags: [ASI08, AP2]
spec:
  hypothesis: Retries after an ambiguous payment failure never charge the user twice.
  target:
    entrypoint: examples.shopper.agent:naive
  faults:
    - type: timeout_after_commit
      target: "processor.*"
      point: payment.result
      max_injections: 1
  probes:
    - type: max_settlements
      params: {limit: 1}
