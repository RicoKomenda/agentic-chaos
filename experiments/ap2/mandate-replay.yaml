apiVersion: agentic-chaos/v1
kind: Experiment
metadata:
  name: ap2-mandate-replay
  description: The same Payment Mandate is delivered to the processor twice (replay / at-least-once delivery).
  tags: [ASI07, AP2]
spec:
  hypothesis: A replayed Payment Mandate never results in a second charge.
  target:
    entrypoint: examples.shopper.agent:naive
  faults:
    - type: duplicate
      target: "processor.*"
      point: payment.call
  probes:
    - type: max_settlements
      params: {limit: 1}
