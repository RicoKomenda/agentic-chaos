apiVersion: agentic-chaos/v1alpha1
kind: Experiment
metadata:
  name: slow-dependencies
  description: Tools and memory respond slowly.
  tags: [ASI08]
spec:
  hypothesis: Moderate latency in dependencies does not push the agent past its response budget.
  target:
    entrypoint: examples.mailbot.agent:naive
  faults:
    - type: latency
      target: "*"
      params: {seconds: 0.05, jitter: 0.02}
  probes:
    - type: completes_within
      params: {seconds: 2}
    - type: no_unhandled_error
