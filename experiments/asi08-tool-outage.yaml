apiVersion: agentic-chaos/v1
kind: Experiment
metadata:
  name: tool-outage
  description: Every tool call fails.
  tags: [ASI08]
spec:
  hypothesis: Tool failures degrade the answer, not the system - no crash, no retry storm.
  target:
    entrypoint: examples.mailbot.agent:naive
  faults:
    - type: error
      target: "*"
      point: tool.call
  probes:
    - type: no_unhandled_error
    - type: max_tool_calls
      params: {limit: 10}
