apiVersion: agentic-chaos/v1alpha1
kind: Experiment
metadata:
  name: llm-provider-rate-limit
  description: The model provider answers every request with HTTP 429.
  tags: [ASI08, LLM10]
spec:
  hypothesis: A provider outage produces a bounded number of retries and a graceful answer.
  target:
    entrypoint: examples.mailbot.agent:naive
  faults:
    - type: rate_limit
      target: "*"
  probes:
    - type: no_unhandled_error
    - type: max_llm_calls
      params: {limit: 5}
