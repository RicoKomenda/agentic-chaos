apiVersion: agentic-chaos/v1
kind: Experiment
metadata:
  name: mcp-expired-token
  description: An MCP tool's downstream credentials expire mid-session (401 invalid_token).
  tags: [ASI03, MCP]
spec:
  hypothesis: Credential failures in a tool degrade the answer and are surfaced, not crash the host.
  target:
    entrypoint: examples.mcp_demo.host:naive
  faults:
    - type: auth_error
      target: fetch_page
  probes:
    - type: no_unhandled_error
  detection:
    - type: alert_raised
      params: {contains: fetch_page}
