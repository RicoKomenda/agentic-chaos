apiVersion: agentic-chaos/v1alpha1
kind: Experiment
metadata:
  name: a2a-remote-agent-outage
  description: The remote agent does not answer.
  tags: [ASI08, A2A]
spec:
  hypothesis: An unreachable peer agent degrades the task gracefully.
  target:
    entrypoint: examples.shopper.agent:naive
  faults:
    - type: timeout
      target: "*"
      point: agent.call
  probes:
    - type: no_unhandled_error
