site_name: Agentic Chaos
site_description: Security chaos engineering for AI agents and LLM applications.
repo_url: https://github.com/RicoKomenda/agentic-chaos
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features: [navigation.sections, navigation.top, content.code.copy, search.highlight]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets: {base_path: ["."], check_paths: true}

nav:
  - Home: index.md
  - Concepts:
      - Principles: principles.md
      - Running chaos safely: safety.md
      - Statistics: statistics.md
  - Guides:
      - Writing experiments: writing-experiments.md
      - Recipes: recipes.md
      - Protocol layers (MCP, A2A, AP2): protocols.md
      - Integrations: integrations.md
  - Reference:
      - Fault catalog: fault-catalog.md
      - Public API: api.md
      - Versioning: versioning.md
      - Interoperability: interop.md
      - Changelog: changelog.md
  - Research:
      - Scenarios: research/scenarios.md
      - Landscape: landscape.md
      - "Case study: DVMA": case-studies/dvma.md
  - Project:
      - Roadmap: roadmap.md
      - Releasing: releasing.md
      - Governance: governance.md
