[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-chaos"
version = "0.1.0.dev0"
description = "Security chaos engineering for AI agents and LLM applications."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Agentic Chaos contributors" }]
keywords = ["chaos engineering", "security", "ai agents", "llm", "resilience", "red teaming", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
agentic-chaos = "agentic_chaos.cli:main"

[project.entry-points.pytest11]
agentic_chaos = "agentic_chaos.pytest_plugin"

[project.urls]
Homepage = "https://github.com/RicoKomenda/agentic-chaos"

[dependency-groups]
case-studies = [
    "pydantic-settings>=2.15.0",
    "qdrant-client==1.12.1",
    "sqlmodel==0.0.22",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "mypy>=2.4.0",
    "types-pyyaml>=6.0.12.20260906",
    "jsonschema>=4.26.0",
    "httpx2>=2.13.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
interop = [
    "a2a-sdk>=1.2.1",
    "anthropic>=1.11.0",
    "mcp>=2.2.0",
    "openai>=3.24.0",
    "uvicorn>=0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_chaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "interop: tests against official third-party SDKs (needs the interop dependency group)",
]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/agentic_chaos"]

[[tool.mypy.overrides]]
# transports are built per httpx-compatible module (httpx or httpx2), so its classes are typed as Any there
module = ["agentic_chaos.integrations.*"]
warn_return_any = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
